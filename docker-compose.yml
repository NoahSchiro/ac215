# Full pipeline, runnable with a single command:
#
#     docker compose up
#
# `ui` waits for `train` to finish, so one command runs preprocessing and
# training and then serves the result. For UI work that should not retrain:
#
#     docker compose up ui --no-deps

services:
  train:
    build:
      context: ./model
    image: gaze-model:dev

    # PyTorch's DataLoader passes tensors between worker processes through
    # /dev/shm. Docker defaults that to 64MB, which a batch of 224x224 images
    # overruns instantly -- and the resulting error reads "No space left on
    # device", which looks like a full disk but is not. This is a property of
    # the sandbox, not the image, so it cannot live in the Dockerfile.
    shm_size: 2gb

    volumes:
      - ./data:/data
      - ./model/checkpoints:/app/checkpoints

    environment:
      - PYTHONUNBUFFERED=1

    # One epoch so `docker compose up` completes: the container has no GPU
    # (Docker Desktop does not pass one through) and a CPU epoch takes hours.
    # Real runs override: `docker compose run --rm train --epochs 30`
    command:
      - --data-root=/data/MPIIFaceGaze
      - --val=13
      - --test=14
      - --epochs=1
      - --workers=2
      - --device=cpu

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: ac215-ui:latest
    ports:
      - "8080:80"
    restart: unless-stopped

    # Makes the two services a pipeline rather than two unrelated containers:
    # the UI only comes up once training has exited successfully.
    depends_on:
      train:
        condition: service_completed_successfully
